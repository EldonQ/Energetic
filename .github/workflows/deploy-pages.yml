name: Deploy to GitHub Pages

# Build the Vite app and publish dist/ to the github-pages environment.
# This is what populates the "Deployments" tab on the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Repo is served at https://<owner>.github.io/Energetic/
          VITE_BASE: /Energetic/

      - uses: actions/configure-pages@v5
        with:
          # First run on a fresh fork: auto-enable Pages if it isn't yet.
          # Avoids the "Get Pages site failed ... Not Found" 404 from this action.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
